name: Hello World CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Run application
        run: |
          output=$(python app.py)
          if [ "$output" != "Hello, World!" ]; then
            echo "Test failed!"
            exit 1
          fi
          echo "Test passed!"